<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FS G.A SiTe // APP & GAME BUILDER</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0505;
            background-image: radial-gradient(circle at 20% 30%, #1a0808 0%, #050101 95%);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            color: #c0b0b0;
            padding: 15px;
        }
        .system-shell {
            max-width: 1500px;
            margin: 0 auto;
            background: rgba(8, 2, 2, 0.92);
            border: 2px solid #4a1515;
            box-shadow: 0 0 60px rgba(100, 0, 0, 0.2), 0 0 30px rgba(0, 50, 200, 0.1), inset 0 0 60px rgba(40, 0, 0, 0.1);
            padding: 20px 22px 30px;
            position: relative;
        }
        .system-shell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 2;
        }
        .header-terminal {
            border-bottom: 2px solid #3a0f0f;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .site-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #b02b2b;
            text-shadow: 0 0 20px #5f0000, 0 0 40px #2a0000, 0 0 60px rgba(0, 100, 255, 0.2);
            text-transform: uppercase;
        }
        .site-title span { color: #6a1a1a; font-weight: 300; letter-spacing: 8px; }
        .sys-status {
            font-size: 0.7rem;
            color: #6a3a3a;
            border: 1px solid #2a0f0f;
            padding: 6px 16px;
            background: #0d0303;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 50, 200, 0.05);
        }
        .sys-status i { font-style: normal; color: #b02b2b; animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
        
        .auth-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #0a0303;
            border: 1px solid #1f0a0a;
            padding: 10px 16px;
            margin-bottom: 18px;
            box-shadow: 0 0 20px rgba(0, 50, 200, 0.05);
        }
        .auth-bar input {
            background: #0f0505;
            border: 1px solid #2a1212;
            padding: 8px 14px;
            color: #c0b0b0;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            flex: 1 1 200px;
            transition: 0.3s;
        }
        .auth-bar input:focus {
            border-color: #2a6aaa;
            box-shadow: 0 0 20px rgba(0, 80, 255, 0.15);
            outline: none;
        }
        .auth-bar .btn-auth {
            background: #1a0808;
            border: 1px solid #3a1515;
            color: #b0a0a0;
            padding: 8px 22px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-bar .btn-auth:hover { background: #2a0f0f; border-color: #6a2222; color: #e0d0d0; box-shadow: 0 0 25px rgba(0, 80, 255, 0.1); }
        .auth-bar .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-bar .user-status {
            color: #4a2a2a;
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-left: auto;
        }
        .auth-bar .user-status.signed-in { color: #6a8a6a; }
        .auth-bar .user-status.unverified { color: #8a6a3a; }
        
        .verification-banner {
            background: #3a2a0a;
            border: 1px solid #6a4a1a;
            color: #b08a4a;
            padding: 10px 16px;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            display: none;
        }
        .verification-banner.active { display: block; }
        
        .broadcast-banner {
            background: #0a1a2a;
            border: 1px solid #2a6aaa;
            color: #4a8aff;
            padding: 12px 16px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
            display: none;
            box-shadow: 0 0 30px rgba(0, 80, 255, 0.15), inset 0 0 30px rgba(0, 80, 255, 0.05);
            border-radius: 4px;
            animation: pulseBlue 2s infinite;
            position: relative;
        }
        .broadcast-banner.active { display: block; }
        .broadcast-banner .broadcast-msg { color: #8ab4ff; font-size: 0.9rem; font-weight: 600; text-shadow: 0 0 20px rgba(0, 80, 255, 0.2); }
        .broadcast-banner .broadcast-time { color: #4a6a8a; font-size: 0.6rem; margin-left: 12px; }
        .broadcast-banner .btn-seen {
            background: transparent;
            border: 1px solid #2a6aaa;
            color: #4a8aff;
            padding: 4px 16px;
            margin-left: 14px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            border-radius: 3px;
        }
        .broadcast-banner .btn-seen:hover { background: #0a1a3a; border-color: #4a8aff; box-shadow: 0 0 30px rgba(0, 80, 255, 0.2); }
        
        @keyframes pulseBlue {
            0% { box-shadow: 0 0 20px rgba(0, 80, 255, 0.1), inset 0 0 20px rgba(0, 80, 255, 0.02); }
            50% { box-shadow: 0 0 40px rgba(0, 80, 255, 0.2), inset 0 0 40px rgba(0, 80, 255, 0.05); }
            100% { box-shadow: 0 0 20px rgba(0, 80, 255, 0.1), inset 0 0 20px rgba(0, 80, 255, 0.02); }
        }
        
        .nav-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 1px solid #2a0a0a;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .nav-item {
            background: transparent;
            border: 1px solid #2a0f0f;
            color: #8a7a7a;
            padding: 8px 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
            background: #0d0505;
        }
        .nav-item:hover { background: #1f0808; border-color: #8f2222; color: #d0d0d0; box-shadow: 0 0 20px rgba(0, 80, 255, 0.05); }
        .nav-item.active { background: #1f0a0a; border-color: #9f2a2a; color: #e0e0e0; box-shadow: 0 0 25px #3f0000, 0 0 30px rgba(0, 80, 255, 0.1); }
        .nav-item.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        
        .panel { display: none; padding: 10px 0; animation: fadePanel 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadePanel { 0% { opacity: 0.2; } 100% { opacity: 1; } }
        
        .builder-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        @media (max-width: 900px) { .builder-layout { grid-template-columns: 1fr; } }
        
        .editor-section {
            background: #080202;
            border: 1px solid #1f0a0a;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0, 50, 200, 0.03);
        }
        .editor-section .section-label {
            color: #4a2a2a;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }
        .editor-section textarea {
            width: 100%;
            height: 380px;
            background: #0a0303;
            border: 1px solid #2a1212;
            color: #b0a0b0;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 12px;
            resize: vertical;
            tab-size: 4;
            transition: 0.3s;
        }
        .editor-section textarea:focus {
            border-color: #2a6aaa;
            box-shadow: 0 0 30px rgba(0, 80, 255, 0.08);
            outline: none;
        }
        
        .snippet-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
            padding: 6px 8px;
            background: #0a0303;
            border: 1px solid #1a0808;
            align-items: center;
        }
        .snippet-bar .snippet-label {
            color: #4a3a3a;
            font-size: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 6px;
        }
        .snippet-bar .snippet-btn {
            background: #0d0505;
            border: 1px solid #1f0a0a;
            color: #6a5a5a;
            padding: 2px 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .snippet-bar .snippet-btn:hover { background: #1a0808; border-color: #4a1515; color: #b0a0a0; }
        
        .preview-section {
            background: #080202;
            border: 1px solid #1f0a0a;
            padding: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 50, 200, 0.03);
        }
        .preview-frame {
            flex: 1;
            min-height: 380px;
            background: #0a0303;
            border: 1px solid #1a0808;
            overflow: hidden;
            position: relative;
        }
        .preview-frame iframe {
            width: 100%;
            height: 100%;
            min-height: 380px;
            border: none;
            background: #fff;
        }
        .preview-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }
        .preview-controls .btn-preview {
            background: #1a0808;
            border: 1px solid #3a1515;
            color: #b0a0a0;
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .preview-controls .btn-preview:hover { background: #2a0f0f; border-color: #6a2222; color: #e0d0d0; box-shadow: 0 0 25px rgba(0, 80, 255, 0.08); }
        .preview-controls .btn-fullscreen {
            background: #0a1a3a;
            border: 1px solid #2a6aaa;
            color: #4a8aff;
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(0, 80, 255, 0.05);
        }
        .preview-controls .btn-fullscreen:hover { background: #0a2a5a; border-color: #4a8aff; box-shadow: 0 0 30px rgba(0, 80, 255, 0.15); }
        .preview-controls .btn-download {
            background: #1a0808;
            border: 1px solid #4a1a1a;
            color: #b02b2b;
            padding: 8px 22px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            margin-left: auto;
        }
        .preview-controls .btn-download:hover {
            background: #2a0f0f;
            border-color: #8f2222;
            box-shadow: 0 0 35px #3a0000, 0 0 40px rgba(0, 80, 255, 0.1);
            color: #d04a4a;
        }
        .preview-controls .btn-share {
            background: #1a0808;
            border: 1px solid #1a3a6a;
            color: #4a8aff;
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .preview-controls .btn-share:hover { background: #0a1a3a; border-color: #2a6aaa; color: #6a9aff; box-shadow: 0 0 25px rgba(0, 80, 255, 0.15); }
        
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0505;
            z-index: 999999;
            display: none;
            flex-direction: column;
            padding: 10px;
            box-shadow: 0 0 60px rgba(0, 80, 255, 0.1);
        }
        .fullscreen-overlay.active { display: flex; }
        .fullscreen-overlay .fs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #0a0303;
            border-bottom: 1px solid #2a0f0f;
            flex-shrink: 0;
        }
        .fullscreen-overlay .fs-header .fs-title {
            color: #4a8aff;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 80, 255, 0.2);
        }
        .fullscreen-overlay .fs-header .fs-title span { color: #4a3a3a; }
        .fullscreen-overlay .fs-header .fs-close {
            background: #1a0808;
            border: 1px solid #4a1515;
            color: #b0a0a0;
            padding: 6px 18px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .fullscreen-overlay .fs-header .fs-close:hover { background: #2a0f0f; border-color: #6a2222; color: #e0d0d0; box-shadow: 0 0 25px rgba(0, 80, 255, 0.1); }
        .fullscreen-overlay .fs-body {
            flex: 1;
            background: #0a0303;
            border: 1px solid #1a0808;
            overflow: hidden;
            position: relative;
        }
        .fullscreen-overlay .fs-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .fullscreen-overlay .fs-footer {
            display: flex;
            justify-content: center;
            padding: 8px 16px;
            background: #0a0303;
            border-top: 1px solid #1a0808;
            flex-shrink: 0;
            gap: 12px;
        }
        .fullscreen-overlay .fs-footer .fs-btn {
            background: #1a0808;
            border: 1px solid #3a1515;
            color: #b0a0a0;
            padding: 6px 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .fullscreen-overlay .fs-footer .fs-btn:hover { background: #2a0f0f; border-color: #6a2222; color: #e0d0d0; }
        .fullscreen-overlay .fs-footer .fs-btn-blue { border-color: #2a6aaa; color: #4a8aff; }
        .fullscreen-overlay .fs-footer .fs-btn-blue:hover { background: #0a1a3a; border-color: #4a8aff; box-shadow: 0 0 30px rgba(0, 80, 255, 0.1); }
        
        .projects-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        .project-card {
            background: #0d0505;
            border: 1px solid #2a0f0f;
            padding: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .project-card:hover { border-color: #6a2222; background: #1a0808; box-shadow: 0 0 25px rgba(0, 80, 255, 0.05); }
        .project-card .name { color: #b0a0a0; font-weight: 600; font-size: 0.9rem; }
        .project-card .date { font-size: 0.6rem; color: #4a2a2a; margin-top: 4px; }
        .project-card .views { font-size: 0.55rem; color: #4a6a8a; margin-top: 2px; }
        .project-card .app-id { font-size: 0.55rem; color: #4a8aff; margin-top: 2px; text-shadow: 0 0 20px rgba(0,80,255,0.1); }
        .project-card .card-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .project-card .card-actions button {
            background: transparent;
            border: 1px solid #2a1212;
            color: #6a5a5a;
            padding: 2px 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .project-card .card-actions button:hover { background: #1a0808; border-color: #4a1515; color: #b0a0a0; }
        .project-card .card-actions .btn-appid { border-color: #1a3a6a; color: #4a8aff; }
        .project-card .card-actions .btn-appid:hover { background: #0a1a3a; border-color: #2a6aaa; color: #6a9aff; }
        .project-card .card-actions .btn-push { border-color: #4a1a1a; color: #b02b2b; }
        .project-card .card-actions .btn-push:hover { background: #1a0a0a; border-color: #6a2222; color: #d04a4a; }
        .project-card .card-actions .btn-delete { border-color: #3a1515; color: #6a2a2a; }
        .project-card .card-actions .btn-delete:hover { border-color: #8f2222; color: #b02b2b; }
        
        .dashboard-title {
            color: #4a8aff;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 80, 255, 0.2);
            border-bottom: 1px solid #2a0f0f;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .dashboard-title span { color: #4a3a3a; font-size: 0.6rem; letter-spacing: 2px; }
        
        .user-list-container {
            background: #080202;
            border: 1px solid #1f0a0a;
            padding: 14px;
            margin-top: 12px;
            box-shadow: 0 0 20px rgba(0, 50, 200, 0.02);
        }
        .user-list-container .section-title {
            color: #4a8aff;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(0, 80, 255, 0.1);
            border-bottom: 1px solid #1a0808;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .user-list-container .section-title span { color: #4a2a2a; font-size: 0.6rem; }
        
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }
        .user-table th {
            text-align: left;
            color: #4a3a3a;
            padding: 8px 6px;
            border-bottom: 1px solid #1a0808;
            t
