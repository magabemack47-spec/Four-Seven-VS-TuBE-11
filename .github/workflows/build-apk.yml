name: Build APK

on:
  workflow_dispatch:
    inputs:
      html_code:
        description: 'HTML code to build'
        required: true
        default: '<h1>Hello World</h1>'
      app_name:
        description: 'App name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package name'
        required: false
        default: 'com.fourseven.myapp'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Debug - Show input
        run: |
          echo "App name: ${{ github.event.inputs.app_name }}"
          echo "HTML code length: ${{ github.event.inputs.html_code }}"
      
      - name: Create app directory
        run: mkdir -p app

      - name: Create index.html
        run: |
          echo "${{ github.event.inputs.html_code }}" > app/index.html
          echo "HTML file created:"
          cat app/index.html

      - name: Create manifest.json
        run: |
          cat > app/manifest.json << 'EOF'
          {
            "name": "${{ github.event.inputs.app_name }}",
            "short_name": "${{ github.event.inputs.app_name }}",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#0a0a0a",
            "theme_color": "#00ff41",
            "icons": [
              {
                "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2300ff41'/><text x='50' y='70' text-anchor='middle' font-size='60' fill='black'>4</text></svg>",
                "sizes": "192x192",
                "type": "image/svg+xml"
              }
            ]
          }
          EOF

      - name: Create service worker
        run: |
          cat > app/sw.js << 'EOF'
          self.addEventListener('install', function(e) {
            e.waitUntil(
              caches.open('app-cache').then(function(cache) {
                return cache.addAll(['/']);
              })
            );
          });
          self.addEventListener('fetch', function(e) {
            e.respondWith(
              caches.match(e.request).then(function(response) {
                return response || fetch(e.request);
              })
            );
          });
          EOF

      - name: List app directory
        run: ls -la app/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PWABuilder
        run: npm install -g pwabuilder

      - name: Build APK with PWABuilder
        run: |
          cd app
          pwabuilder package --platform android || echo "Build continued"

      - name: Check output directory
        run: |
          ls -la app/ || echo "No app directory"
          ls -la app/output/ || echo "No output directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/output/*.apk

      - name: Upload HTML file
        uses: actions/upload-artifact@v4
        with:
          name: html-file
          path: app/index.html

      - name: Upload all files
        uses: actions/upload-artifact@v4
        with:
          name: app-files
          path: app/