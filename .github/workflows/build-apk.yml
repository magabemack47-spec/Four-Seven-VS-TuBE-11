name: FOUR × SEVEN APK Builder

on:
  repository_dispatch:
    types:
      - four-seven-build

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    env:
      JOB_ID: ${{ github.event.client_payload.jobId }}
      APP_NAME: ${{ github.event.client_payload.appName }}
      PACKAGE_NAME: ${{ github.event.client_payload.packageName }}
      API_BASE_URL: ${{ github.event.client_payload.apiBaseUrl }}
      BUILDER_API_SECRET: ${{ secrets.BUILDER_API_SECRET }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show build information
        run: |
          echo "======================================"
          echo "⟦ FOUR × SEVEN ⟧ APK BUILDER"
          echo "======================================"
          echo "App: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Job: $JOB_ID"
          echo "======================================"

      - name: Tell API build started
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/progress/$JOB_ID" \
            -d '{
              "progress": 20,
              "statusText": "Preparing",
              "message": "Preparing your Android project..."
            }'

      - name: Download project
        run: |
          set -e

          mkdir -p input
          cd input

          curl --fail-with-body -sS \
            -L \
            -OJ \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/project/$JOB_ID"

          echo "Downloaded project:"
          ls -lah

      - name: Tell API project downloaded
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/progress/$JOB_ID" \
            -d '{
              "progress": 30,
              "statusText": "Project Ready",
              "message": "Project downloaded. Preparing web files..."
            }'

      - name: Prepare web project
        shell: bash
        run: |
          set -e

          mkdir -p web

          PROJECT_FILE="$(find input -maxdepth 1 -type f | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "No project file was downloaded."
            exit 1
          fi

          echo "Project file: $PROJECT_FILE"

          case "$PROJECT_FILE" in

            *.zip|*.ZIP)

              echo "ZIP project detected."

              mkdir -p extracted

              if unzip -Z1 "$PROJECT_FILE" \
                | grep -E '(^/|(^|/)\.\.(/|$))' \
                >/dev/null; then

                echo "Unsafe ZIP paths detected."
                exit 1
              fi

              unzip -q \
                "$PROJECT_FILE" \
                -d extracted

              INDEX_FILE="$(
                find extracted \
                -type f \
                -iname 'index.html' \
                | head -n 1
              )"

              if [ -z "$INDEX_FILE" ]; then
                echo "ZIP project does not contain index.html."
                exit 1
              fi

              ROOT_DIR="$(dirname "$INDEX_FILE")"

              cp -a "$ROOT_DIR"/. web/

              ;;

            *.html|*.HTML|*.htm|*.HTM)

              echo "HTML project detected."

              cp \
                "$PROJECT_FILE" \
                web/index.html

              ;;

            *)

              echo "Unsupported project type."
              exit 1

              ;;

          esac

          if [ ! -f web/index.html ]; then
            echo "index.html was not found."
            exit 1
          fi

          echo "Web project ready:"
          find web \
            -maxdepth 2 \
            -type f \
            | head -100

      - name: Tell API web project prepared
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/progress/$JOB_ID" \
            -d '{
              "progress": 40,
              "statusText": "Building Android Project",
              "message": "Creating the Android application..."
            }'

      - name: Create Capacitor Android project
        run: |
          set -e

          mkdir -p builder

          cd builder

          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

          npx cap init \
            "$APP_NAME" \
            "$PACKAGE_NAME" \
            --web-dir=../web

          npx cap add android

          npx cap sync android

      - name: Tell API Android project created
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/progress/$JOB_ID" \
            -d '{
              "progress": 60,
              "statusText": "Compiling APK",
              "message": "Compiling the Android application..."
            }'

      - name: Build release APK
        working-directory: builder/android
        run: |
          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            --no-daemon

      - name: Find APK
        run: |
          set -e

          APK_PATH="$(
            find \
              builder/android/app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "APK was not created."
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "APK created:"
          ls -lh "$APK_PATH"

      - name: Tell API APK is ready
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/progress/$JOB_ID" \
            -d '{
              "progress": 90,
              "statusText": "Uploading APK",
              "message": "Uploading your finished APK..."
            }'

      - name: Upload APK to FOUR × SEVEN
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            -F "apk=@$APK_PATH;type=application/vnd.android.package-archive" \
            "$API_BASE_URL/api/internal/complete/$JOB_ID"

      - name: Build complete
        run: |
          echo "======================================"
          echo "🎉 APK BUILD COMPLETE"
          echo "======================================"
          echo "App: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Job: $JOB_ID"
          echo "======================================"

      - name: Report build failure
        if: failure()
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: $BUILDER_API_SECRET" \
            "$API_BASE_URL/api/internal/fail/$JOB_ID" \
            -d '{
              "message": "GitHub Actions Android build failed."
            }' \
            || true