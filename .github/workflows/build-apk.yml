name: FOUR × SEVEN APK Builder

on:
  repository_dispatch:
    types:
      - four-seven-build

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: https://four-seven-vs-tu-be-11.vercel.app
      BUILDER_API_SECRET: ${{ secrets.BUILDER_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Prepare workspace
        run: |
          rm -rf build-work
          mkdir -p build-work/project
          mkdir -p build-work/www

      - name: Download uploaded project
        run: |
          curl -fL \
            -H "x-builder-secret: ${BUILDER_API_SECRET}" \
            "${API_BASE_URL}/api/internal/project/${{ github.event.client_payload.jobId }}" \
            -o build-work/project/uploaded

      - name: Detect and prepare project
        shell: bash
        run: |
          set -e

          FILE="build-work/project/uploaded"
          WWW="build-work/www"

          if file "$FILE" | grep -qi "zip"; then
            echo "ZIP project detected."
            mkdir -p build-work/unpacked
            unzip -q "$FILE" -d build-work/unpacked

            INDEX_FILE=$(find build-work/unpacked -type f \( -iname "index.html" -o -iname "index.htm" \) | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "No index.html found in ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$INDEX_FILE")

            cp -R "$PROJECT_DIR"/. "$WWW"/
          else
            echo "HTML project detected."

            if ! grep -qi "<html" "$FILE"; then
              echo "Uploaded file does not appear to be an HTML document."
            fi

            cp "$FILE" "$WWW/index.html"
          fi

          if [ ! -f "$WWW/index.html" ]; then
            echo "index.html was not found."
            exit 1
          fi

          echo "Web project ready:"
          find "$WWW" -maxdepth 2 -type f | sort

      - name: Create Capacitor project
        working-directory: build-work
        run: |
          cat > package.json <<'EOF'
          {
            "name": "four-seven-generated-app",
            "private": true,
            "version": "1.0.0",
            "scripts": {
              "build": "echo web-build-complete"
            },
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          npm install

          cat > capacitor.config.json <<EOF
          {
            "appId": "${{ github.event.client_payload.packageName }}",
            "appName": "${{ github.event.client_payload.appName }}",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: Copy web files
        working-directory: build-work
        run: |
          npx cap copy android

      - name: Update build progress
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-builder-secret: ${BUILDER_API_SECRET}" \
            "${API_BASE_URL}/api/internal/progress/${{ github.event.client_payload.jobId }}" \
            -d '{
              "progress": 55,
              "statusText": "Building Android APK",
              "message": "Compiling Android project..."
            }' || true

      - name: Build release APK
        working-directory: build-work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        id: apk
        working-directory: build-work
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "Generated APK: $APK"

      - name: Upload APK to Builder API
        run: |
          curl -fL \
            -X POST \
            -H "x-builder-secret: ${BUILDER_API_SECRET}" \
            -F "apk=@${{ steps.apk.outputs.APK }}" \
            "${API_BASE_URL}/api/internal/complete/${{ github.event.client_payload.jobId }}"

      - name: Build completed
        run: |
          echo "=========================================="
          echo "     FOUR × SEVEN APK BUILD COMPLETE"
          echo "=========================================="
          echo "Job ID: ${{ github.event.client_payload.jobId }}"